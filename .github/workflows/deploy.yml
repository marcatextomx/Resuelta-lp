name: Deploy to Firebase Hosting (production)

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Write GCP service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

      - name: Validate service account file
        run: |
          test -s "$GOOGLE_APPLICATION_CREDENTIALS" || { echo "::error::gcp-key.json está vacío"; exit 1; }
          node -e "
            const k = require(process.env.GOOGLE_APPLICATION_CREDENTIALS);
            for (const f of ['type', 'project_id', 'private_key', 'client_email']) {
              if (!k[f]) { console.error('Falta el campo: ' + f); process.exit(1); }
            }
            console.log('OK — type=' + k.type + ' project_id=' + k.project_id + ' client_email=' + k.client_email);
          "
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

      - name: Deploy Firestore rules
        run: npx firebase-tools deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}

      - name: Remove GCP service account credentials
        if: always()
        run: rm -f "${{ github.workspace }}/gcp-key.json"

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
